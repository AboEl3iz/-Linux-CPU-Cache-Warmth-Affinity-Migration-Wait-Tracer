name: CI & Packaging Workflow

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck & Validate Syntax
        run: |
          shellcheck cpu_cache_affinity_wait.sh scripts/build_packages.sh
          bash -n cpu_cache_affinity_wait.sh
          bash -n scripts/build_packages.sh

  package:
    name: Build Packages (.deb, .rpm, .tar.gz)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm build-essential

      - name: Build Packages via Makefile
        run: |
          make package VERSION=${GITHUB_REF_NAME#v}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
